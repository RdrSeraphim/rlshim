[package]
name = "rlshim"
version = "1.5.0"
edition = "2024"
authors = ["Seraphim Pardee <me@srp.life>"]
description = "A lightweight, native Linux launcher for RuneLite."
license = "BSD-2-Clause"
repository = "https://github.com/RdrSeraphim/rlshim"

[dependencies]
aes-gcm = "0.10"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true